<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevarxona CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --primary: #6366f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-color); min-height: 100vh; padding: 16px; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 480px; width: 100%; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .app-header { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 40px; margin-bottom: 10px; }
        .app-header h1 { font-size: 24px; margin-bottom: 5px; }
        .app-header p { color: #94a3b8; font-size: 14px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); display: flex; align-items: center; text-decoration: none; color: white; transition: transform 0.2s, background 0.2s; }
        .glass-card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.1); }
        .card-icon { font-size: 28px; margin-right: 15px; }
        .card-info h3 { font-size: 18px; margin-bottom: 4px; }
        .card-info p { font-size: 13px; color: #94a3b8; }
        .arrow { margin-left: auto; font-size: 18px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="logo-icon">✂️</div>
            <h1>Chevarxona CRM</h1>
            <p>Ish vaqtini nazorat qilish tizimi</p>
        </header>

        <div class="menu-cards">
            <a href="worker.html" class="glass-card">
                <span class="card-icon">👤</span>
                <div class="card-info">
                    <h3>Ishchi Paneli</h3>
                    <p>Kelish, ketish va tanaffusni belgilash</p>
                </div>
                <span class="arrow">➔</span>
            </a>

            <a href="admin.html" class="glass-card">
                <span class="card-icon">👑</span>
                <div class="card-info">
                    <h3>Boshliq Paneli</h3>
                    <p>Real vaqt nazorati va juma kunlari sozlamasi</p>
                </div>
                <span class="arrow">➔</span>
            </a>

            <a href="stats.html" class="glass-card">
                <span class="card-icon">📊</span>
                <div class="card-info">
                    <h3>Statistika va Chartlar</h3>
                    <p>Kunlik, haftalik, oylik diagrammalar</p>
                </div>
                <span class="arrow">➔</span>
            </a>
        </div>
    </div>
</body>
</html>
