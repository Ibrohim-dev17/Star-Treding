<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italki TWA - Asosiy Sahifa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #F8FAFC);
            color: var(--tg-theme-text-color, #0F172A);
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header / Yuqori qism -->
    <header class="p-4 bg-white shadow-sm sticky top-0 z-50">
        <div class="flex justify-between items-center mb-3">
            <div>
                <p class="text-xs text-gray-400">Xush kelibsiz 👋</p>
                <h1 id="username" class="text-lg font-bold">Alisher</h1>
            </div>
            <a href="cabinet.html" class="flex items-center gap-1 bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-xs font-semibold">
                <span>💰</span>
                <span id="user-balance">120,000 so'm</span>
            </a>
        </div>
        <!-- Qidiruv paneli -->
        <div class="relative">
            <input type="text" id="search-input" placeholder="Ustoz yoki fanni qidiring..." 
                class="w-full bg-gray-100 border-none rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <span class="absolute right-3 top-3 text-gray-400">🔍</span>
        </div>
    </header>

    <!-- Kategoriyalar filtri -->
    <div class="flex gap-2 p-4 overflow-x-auto no-scrollbar">
        <button onclick="filterCategory('all')" class="cat-btn bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">Barchasi</button>
        <button onclick="filterCategory('english')" class="cat-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">Ingliz tili</button>
        <button onclick="filterCategory('ielts')" class="cat-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">IELTS</button>
        <button onclick="filterCategory('russian')" class="cat-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm">Rus tili</button>
    </div>

    <!-- O'qituvchilar ro'yxati -->
    <main class="px-4 space-y-3" id="teachers-list">
        <!-- Kartochka 1 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex gap-3 items-center">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Teacher" class="w-16 h-16 rounded-xl object-cover">
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-sm">Madina Karimova</h3>
                    <span class="text-xs font-semibold text-yellow-600 bg-yellow-50 px-2 py-0.5 rounded-md">⭐ 4.9 (84)</span>
                </div>
                <p class="text-xs text-gray-500 mt-0.5">IELTS 8.5 / Native Speaker</p>
                <div class="flex justify-between items-center mt-3">
                    <span class="text-xs font-bold text-blue-600">80,000 so'm <span class="text-gray-400 font-normal">/ soat</span></span>
                    <button onclick="bookLesson('Madina Karimova')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Band qilish</button>
                </div>
            </div>
        </div>

        <!-- Kartochka 2 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex gap-3 items-center">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" alt="Teacher" class="w-16 h-16 rounded-xl object-cover">
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-sm">Jasur Rahimov</h3>
                    <span class="text-xs font-semibold text-yellow-600 bg-yellow-50 px-2 py-0.5 rounded-md">⭐ 4.8 (52)</span>
                </div>
                <p class="text-xs text-gray-500 mt-0.5">General English & Grammar</p>
                <div class="flex justify-between items-center mt-3">
                    <span class="text-xs font-bold text-blue-600">60,000 so'm <span class="text-gray-400 font-normal">/ soat</span></span>
                    <button onclick="bookLesson('Jasur Rahimov')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Band qilish</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Pastki Navigatsiya (Bottom Menu) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2.5 z-50">
        <a href="index.html" class="flex flex-col items-center text-blue-600 text-xs">
            <span class="text-lg">🏠</span>
            <span class="font-medium mt-0.5">Asosiy</span>
        </a>
        <a href="cabinet.html" class="flex flex-col items-center text-gray-400 text-xs">
            <span class="text-lg">👤</span>
            <span class="mt-0.5">Kabinet</span>
        </a>
    </nav>

    <script>
        // Telegram WebApp sozlamasi
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        function bookLesson(teacherName) {
            alert(`${teacherName} bilan darsni bron qilish oynasiga o'tish...`);
        }

        function filterCategory(category) {
            // Filter funksiyasi uchun joy
            console.log("Tanlangan kategoriya:", category);
        }
    </script>
</body>
</html>
