
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Gateway</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #090d16;
            --surface: rgba(18, 24, 38, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .gateway-card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
    <div class="gateway-card">
        <div class="spinner"></div>
        <h2>Autentifikatsiya qilinmoqda</h2>
        <p>Xavfsiz korporativ tarmoqqa ulanish...</p>
    </div>

    <script>
        // Telegram WebApp orqali foydalanuvchini aniqlash simulyatsiyasi
        setTimeout(() => {
            const tg = window.Telegram.WebApp;
            const user = tg.initDataUnsafe?.user;
            
            // Masalan, boshliqning Telegram ID raqamini shu yerga yozasiz yoki bazadan tekshirasiz
            const ADMIN_IDS = [123456789]; // Boshliqlarning haqiqiy IDlari

            if (user && ADMIN_IDS.includes(user.id)) {
                window.location.href = 'admin-login.html';
            } else {
                // Sinov uchun hozircha oddiy ishchi paneliga o'tadi
                window.location.href = 'worker.html';
            }
        }, 1200);
    </script>
</body>
</html>
