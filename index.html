<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamonaviy Ilova Interfeysi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Scrollbar'ni yashirish uchun stil */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen">

    <!-- Mobil Ilova Oyna Konteyneri -->
    <div class="w-full max-w-md bg-white h-[850px] shadow-2xl rounded-3xl flex flex-col overflow-hidden relative border border-slate-200">
        
        <!-- 1. YUQORI HEADER QISMI -->
        <header class="px-5 pt-6 pb-4 bg-white border-b border-slate-100">
            <div class="flex items-center justify-between gap-3 mb-4">
                <!-- Qidiruv maydoni -->
                <div class="flex-1 flex items-center bg-slate-100 rounded-2xl px-4 py-3 gap-3 border border-slate-200 focus-within:border-indigo-500 transition">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="Qidirish..." class="bg-transparent w-full text-sm text-slate-800 focus:outline-none placeholder-slate-400">
                </div>

                <!-- Mikrofon tugmasi -->
                <button class="bg-indigo-50 text-indigo-600 p-3 rounded-2xl hover:bg-indigo-100 active:scale-95 transition flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>
            </div>

            <!-- Qo'shimcha boshqaruv tugmalari (Saqlash, Galochka, Ustozlar) -->
            <div class="flex items-center justify-between gap-2">
                <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 active:scale-95 transition">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>Tasdiqlash</span>
                </button>

                <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 active:scale-95 transition">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span>Ustozlar</span>
                </button>

                <button class="flex items-center justify-center p-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-slate-700 active:scale-95 transition">
                    <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 2. FANLAR QISMI (Yon tomonga suriladigan qator - Horizontal Scroll) -->
        <div class="py-3 bg-white border-b border-slate-100">
            <div class="flex items-center gap-2.5 overflow-x-auto no-scrollbar px-5">
                <button class="whitespace-nowrap px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-medium shadow-md shadow-indigo-200 active:scale-95 transition">
                    Barchasi
                </button>
                <button class="whitespace-nowrap px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-medium active:scale-95 transition">
                    IELTS
                </button>
                <button class="whitespace-nowrap px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-medium active:scale-95 transition">
                    Ingliz tili
                </button>
                <button class="whitespace-nowrap px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-medium active:scale-95 transition">
                    Rus tili
                </button>
                <button class="whitespace-nowrap px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-medium active:scale-95 transition">
                    Matematika
                </button>
                <button class="whitespace-nowrap px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-medium active:scale-95 transition">
                    Dasturlash
                </button>
            </div>
        </div>

        <!-- 3. ASOSIY KONTENT QISMI -->
        <main class="flex-1 p-5 overflow-y-auto space-y-4">
            <!-- Namunaaviy karta -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg">IELTS Writing</span>
                    <span class="text-xs text-slate-400">Yangi</span>
                </div>
                <h3 class="font-bold text-slate-800 text-sm mb-1">Task 2 Esseni mukammal yozish sirlari</h3>
                <p class="text-xs text-slate-500">Akademik lug'atlar va grammatik qoliplardan foydalanish bo'yicha qo'llanma.</p>
            </div>

            <!-- Namunaaviy karta -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-lg">Rus tili</span>
                    <span class="text-xs text-slate-400">12 ta dars</span>
                </div>
                <h3 class="font-bold text-slate-800 text-sm mb-1">Razgovorniy klub - Jonli muloqot</h3>
                <p class="text-xs text-slate-500">Kundalik hayotda eng ko'p ishlatiladigan iboralar va qoidalar.</p>
            </div>
        </main>

        <!-- 4. PASTKI NAVIGATSIYA MENYU (Emojilar o'rniga SVG ikonkalari bilan) -->
        <nav class="bg-white border-t border-slate-100 py-3 px-6 flex items-center justify-between">
            <!-- Asosiy -->
            <button class="flex flex-col items-center gap-1 text-indigo-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span class="text-[10px] font-medium">Asosiy</span>
            </button>

            <!-- Kurslar -->
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <span class="text-[10px] font-medium">Kurslar</span>
            </button>

            <!-- Reyting -->
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                <span class="text-[10px] font-medium">Reyting</span>
            </button>

            <!-- Profil -->
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-[10px] font-medium">Profil</span>
            </button>
        </nav>

    </div>

</body>
</html>
