<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chevarxona Boshqaruv Tizimi - Xodim Kirish</title>
<style>
:root {
--bg-color: #07090e;
--card-bg: rgba(13, 17, 28, 0.85);
--border-color: rgba(255, 255, 255, 0.08);
--primary: #3b82f6;
--primary-hover: #2563eb;
--text-main: #f8fafc;
--text-muted: #64748b;
--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
​* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
​body {
background-color: var(--bg-color);
background-image:
radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
radial-gradient(circle at 90% 80%, rgba(15, 23, 42, 0.4) 0%, transparent 40%);
color: var(--text-main);
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}
​.auth-card {
background: var(--card-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border-color);
padding: 45px 40px;
border-radius: 20px;
width: 100%;
max-width: 420px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
​@keyframes cardAppear {
from { opacity: 0; transform: translateY(20px) scale(0.98); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
​.logo-area {
text-align: center;
margin-bottom: 35px;
}
​.brand-logo {
display: inline-flex;
justify-content: center;
align-items: center;
width: 64px;
height: 64px;
background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
border-radius: 16px;
margin-bottom: 16px;
box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
position: relative;
}
​.brand-logo::after {
content: '';
width: 24px;
height: 2px;
background: #ffffff;
border-radius: 2px;
box-shadow: 0 6px 0 #ffffff, 0 -6px 0 #ffffff;
}
​.logo-area h2 {
font-size: 22px;
font-weight: 700;
letter-spacing: 0.5px;
color: #ffffff;
}
​.logo-area p {
color: var(--text-muted);
font-size: 13px;
margin-top: 6px;
font-weight: 400;
}
​.input-group {
margin-bottom: 20px;
}
​.input-group label {
display: block;
font-size: 12px;
font-weight: 500;
color: var(--text-muted);
margin-bottom: 8px;
text-transform: uppercase;
letter-spacing: 0.5px;
}
​.input-group input {
width: 100%;
padding: 14px 16px;
background: rgba(255, 255, 255, 0.02);
border: 1px solid var(--border-color);
border-radius: 12px;
color: #ffffff;
font-size: 14px;
outline: none;
transition: var(--transition);
}
​.input-group input:focus {
border-color: var(--primary);
background: rgba(59, 130, 246, 0.03);
box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}
​.btn-primary {
width: 100%;
padding: 14px;
background: var(--primary);
color: white;
border: none;
border-radius: 12px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
transition: var(--transition);
margin-top: 10px;
box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
​.btn-primary:hover {
background: var(--primary-hover);
transform: translateY(-1px);
box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
}
​.btn-primary:active {
transform: translateY(0);
}
​.admin-link-area {
margin-top: 25px;
text-align: center;
border-top: 1px solid var(--border-color);
padding-top: 20px;
}
​.boss-portal-link {
color: var(--text-muted);
font-size: 13px;
text-decoration: none;
transition: var(--transition);
font-weight: 500;
}
​.boss-portal-link:hover {
color: var(--primary);
}
</style>
</head>
<body>
​<div class="auth-card">
<div class="logo-area">
<div class="brand-logo"></div>
<h2>CHEVARXONA</h2>
<p>Xodimlar uchun boshqaruv tizimi</p>
</div>
​<form id="workerLoginForm">
<div class="input-group">
<label>Telefon raqam</label>
<input type="text" id="phone" placeholder="+998 90 123 45 67" required>
</div>
<div class="input-group">
<label>Parol</label>
<input type="password" id="password" placeholder="••••••••" required>
</div>
<button type="submit" class="btn-primary">Tizimga kirish</button>
</form>
​<div class="admin-link-area">
<a href="boss-login.html" class="boss-portal-link">Rahbariyat uchun maxsus kirish</a>
</div>
</div>
​<script>
document.getElementById('workerLoginForm').addEventListener('submit', function(e) {
e.preventDefault();
const phoneInput = document.getElementById('phone').value.trim();
const passwordInput = document.getElementById('password').value.trim();
​if (phoneInput && passwordInput) {
// Xodim sifatida tizimga muvaffaqiyatli kirish simulyatsiyasi
window.location.href = 'worker.html';
} else {
alert('Iltimos, barcha maydonlarni to'ldiring!');
}
});
</script>
</body>
</html>
