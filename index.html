<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chevarxona HRM</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(135deg,#0f172a,#111827,#1e293b);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:600px;

height:600px;

background:#2563eb;

filter:blur(180px);

opacity:.25;

top:-250px;

left:-200px;

}

body::after{

content:"";

position:absolute;

width:500px;

height:500px;

background:#8b5cf6;

filter:blur(180px);

opacity:.25;

bottom:-200px;

right:-150px;

}

.card{

position:relative;

z-index:10;

width:380px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.1);

border-radius:28px;

padding:35px;

box-shadow:0 20px 80px rgba(0,0,0,.45);

animation:show .7s;

}

@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

width:80px;

height:80px;

border-radius:25px;

background:linear-gradient(135deg,#3b82f6,#7c3aed);

display:flex;

justify-content:center;

align-items:center;

font-size:35px;

margin:auto;

margin-bottom:25px;

box-shadow:0 10px 40px rgba(59,130,246,.5);

}

h1{

text-align:center;

font-size:28px;

margin-bottom:8px;

}

p{

text-align:center;

color:#cbd5e1;

margin-bottom:30px;

}

.input{

width:100%;

height:55px;

background:rgba(255,255,255,.05);

border:none;

outline:none;

border-radius:16px;

padding:0 18px;

color:white;

font-size:16px;

margin-bottom:18px;

border:1px solid rgba(255,255,255,.06);

transition:.3s;

}

.input:focus{

border-color:#3b82f6;

box-shadow:0 0 20px rgba(59,130,246,.3);

}

button{

width:100%;

height:56px;

border:none;

border-radius:16px;

cursor:pointer;

font-size:17px;

font-weight:600;

background:linear-gradient(135deg,#2563eb,#7c3aed);

color:white;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

}

.bottom{

margin-top:22px;

display:flex;

justify-content:space-between;

font-size:14px;

}

.bottom a{

text-decoration:none;

color:#60a5fa;

}

.version{

margin-top:28px;

text-align:center;

font-size:12px;

color:#64748b;

}

.loading{

display:none;

margin-top:20px;

text-align:center;

}

.loader{

width:45px;

height:45px;

border:4px solid rgba(255,255,255,.15);

border-top:4px solid #3b82f6;

border-radius:50%;

margin:auto;

animation:spin .8s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

.loading p{

margin-top:15px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🧵
</div>

<h1>Chevarxona HRM</h1>

<p>Xodimlarni boshqarish tizimi</p>

<input
class="input"
id="username"
placeholder="Login">

<input
class="input"
id="password"
type="password"
placeholder="Parol">

<button onclick="login()">

Tizimga kirish

</button>

<div class="loading" id="loading">

<div class="loader"></div>

<p>Tekshirilmoqda...</p>

</div>

<div class="bottom">

<a href="#">Parolni unutdim</a>

<a href="#">Yordam</a>

</div>

<div class="version">

Version 1.0

</div>

</div>

<script>

const tg=window.Telegram.WebApp;

tg.expand();

function login(){

document.getElementById("loading").style.display="block";

setTimeout(()=>{

const login=document.getElementById("username").value;

if(login.toLowerCase()=="admin"){

location.href="admin-dashboard.html";

}else{

location.href="worker-dashboard.html";

}

},1500);

}

</script>

</body>
</html>
