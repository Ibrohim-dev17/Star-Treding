<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishchi Paneli</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-color); min-height: 100vh; padding: 16px; }
        .container { max-width: 480px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .top-nav { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { color: var(--text-color); text-decoration: none; background: var(--glass-bg); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--glass-border); margin-right: 15px; font-size: 14px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .timer-display { text-align: center; }
        #current-time { font-size: 36px; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .status-badge.active { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; color: white; margin-bottom: 10px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); }
        .info-card h4 { margin-bottom: 12px; font-size: 16px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Orqaga</a>
            <h2>Salom, Ustoz! 👋</h2>
        </div>

        <div class="glass-card timer-display">
            <span id="current-time">00:00:00</span>
            <p id="work-status" class="status-badge">Hozircha ishda emassiz</p>
        </div>

        <div class="action-grid">
            <button class="btn btn-success" onclick="startWork()">🟢 Ishni Boshlash</button>
            <button class="btn btn-warning" onclick="toggleBreak()">☕ Tanaffus</button>
            <button class="btn btn-danger" onclick="endWork()">🔴 Ishni Tugatish</button>
        </div>

        <div class="glass-card info-card">
            <h4>Bugungi ko'rsatkich</h4>
            <div class="stat-row">
                <span>Ishlangan vaqt:</span>
                <strong id="worked-hours">0 soat 0 min</strong>
            </div>
            <div class="stat-row">
                <span>Tanaffus vaqti:</span>
                <strong id="break-hours">0 min</strong>
            </div>
        </div>
    </div>

    <script>
        // Real vaqt soatini ko'rsatib turish
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        function startWork() {
            const badge = document.getElementById('work-status');
            badge.innerText = "🟢 Hozir ishda";
            badge.classList.add('active');
            alert("Ish boshlandi!");
        }

        function toggleBreak() {
            alert("Tanaffus rejimi o'zgardi.");
        }

        function endWork() {
            const badge = document.getElementById('work-status');
            badge.innerText = "🔴 Ish yakunlandi";
            badge.classList.remove('active');
            alert("Ish yakunlandi va vaqt saqlandi!");
        }
    </script>
</body>
</html>
