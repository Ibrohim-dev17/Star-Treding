<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boshqaruv Paneli</title>
    <link rel="stylesheet" href="css/style.min.html">
</head>
<body>
    <div class="container animate-fade">
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Orqaga</a>
            <h2>Boshqaruv Paneli 👑</h2>
        </div>

        <!-- Juma kuni sozlamasi -->
        <div class="glass-card setting-card">
            <div class="setting-info">
                <h3>Juma Kuni Holati</h3>
                <p>Juma odatiy dam olish kuni sifatida belgilangan.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="fridayToggle" onchange="toggleFridayWork(this)">
                <span class="slider round"></span>
            </label>
        </div>

        <h3 class="section-title">Ishchilar ro'yxati (Real vaqt)</h3>
        
        <div class="workers-list" id="workersListContainer">
            <!-- Dinamik ishchilar ro'yxati chiqadi -->
            <div class="glass-card worker-item">
                <div class="worker-details">
                    <h4>Azizbek (Chevar)</h4>
                    <p class="status-working">🟢 Ishda (08:30 dan beri)</p>
                </div>
                <button class="btn-sm btn-accent" onclick="markExtraDay('Azizbek')">Qo'shimcha Kun</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
