<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boshqaruv Paneli</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --primary: #6366f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-color); min-height: 100vh; padding: 16px; }
        .container { max-width: 480px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .top-nav { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { color: var(--text-color); text-decoration: none; background: var(--glass-bg); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--glass-border); margin-right: 15px; font-size: 14px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .setting-card { display: flex; justify-content: space-between; align-items: center; }
        .setting-info h3 { font-size: 16px; margin-bottom: 4px; }
        .setting-info p { font-size: 12px; color: #94a3b8; }
        /* Switch tugmasi dizayni */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }
        .section-title { font-size: 16px; margin-bottom: 12px; color: #cbd5e1; }
        .worker-item { display: flex; justify-content: space-between; align-items: center; }
        .worker-details h4 { font-size: 15px; margin-bottom: 4px; }
        .status-working { font-size: 12px; color: #86efac; }
        .btn-sm { padding: 8px 12px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Orqaga</a>
            <h2>Boshqaruv Paneli 👑</h2>
        </div>

        <!-- Juma kuni sozlamasi -->
        <div class="glass-card setting-card">
            <div class="setting-info">
                <h3>Juma Kuni Holati</h3>
                <p>Juma odatiy dam olish kuni</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="fridayToggle" onchange="toggleFriday(this)">
                <span class="slider round"></span>
            </label>
        </div>

        <h3 class="section-title">Ishchilar ro'yxati (Real vaqt)</h3>
        
        <div class="glass-card worker-item">
            <div class="worker-details">
                <h4>Azizbek (Chevar)</h4>
                <p class="status-working">🟢 Ishda (08:30 dan)</p>
            </div>
            <button class="btn-sm" onclick="markExtraDay('Azizbek')">Qo'shimcha Kun</button>
        </div>
    </div>

    <script>
        function toggleFriday(element) {
            if(element.checked) {
                alert("Juma kuni ish kuni sifatida belgilandi!");
            } else {
                alert("Juma kuni dam olish kuni qilindi.");
            }
        }

        function markExtraDay(name) {
            alert(name + " uchun qo'shimcha ish kuni qo'shildi!");
        }
    </script>
</body>
</html>
